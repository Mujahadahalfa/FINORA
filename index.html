<style>

.lkc{width:100%;max-width:320px;text-align:center}.dots{display:flex;gap:14px;justify-content:center;margin:16px 0 22px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #fff9}.dots i.on{background:#fff}
.lkp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lkp button{height:64px;border-radius:50%;border:0;background:#ffffff1f;color:#fff;font-size:24px;font-weight:600;cursor:pointer}.lkp button:active{background:#ffffff40}
.shake{animation:sk .35s}@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

#sp{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#0b1220,#0f1b3d 55%,#1d4ed8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s}#sp.out{opacity:0;pointer-events:none}#sp:empty{display:none}#sp img{animation:pop .7s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}}

.flt{display:flex;gap:8px;flex-wrap:wrap}.flt input,.flt select{flex:1 1 140px;margin:0 0 8px;min-width:0}

.tbw{display:none;overflow-x:auto}.tb{width:100%;border-collapse:collapse}.tb th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:10px 8px;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;white-space:nowrap}.tb td{padding:9px 8px;border-bottom:1px solid var(--bd)}.tb tbody tr{cursor:pointer}.tb tbody tr:hover td{background:var(--bg)}.tb .r{text-align:right;font-weight:700}
.av.sm{width:30px;height:30px;border-radius:9px;flex:none}
.cols2{display:grid;gap:12px;margin-bottom:12px}.cols2>.card{margin:0}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
@media(min-width:800px){.top{padding-left:max(24px,calc((100% - 900px)/2 + 14px));padding-right:max(24px,calc((100% - 900px)/2 + 14px))}.bcard{max-width:520px}}
@media(min-width:1000px){.top{padding-left:max(24px,calc((100% - 1180px)/2 + 14px));padding-right:max(24px,calc((100% - 1180px)/2 + 14px))}.body{max-width:1180px}.dgrid{grid-template-columns:repeat(6,1fr)}.dgrid>.s2{grid-column:span 2}.dgrid>.s3{grid-column:span 3}.dk{display:block!important}.cols2{grid-template-columns:1fr 1fr}.lst{display:none}.tbw{display:block}.bk.side{align-items:stretch;justify-content:flex-end}.bk.side .md{max-width:440px;height:100%;max-height:100%;border-radius:24px 0 0 24px;animation:sl .25s}}
.bar i{animation:fill .9s ease-out}@keyframes fill{from{width:0}}
.trs{overflow-x:auto;margin-top:4px}.tb2{animation:grow .7s ease-out;transform-origin:bottom;transform-box:fill-box}@keyframes grow{from{transform:scaleY(0)}}
.seg.trt{margin:6px 0 4px}.trd{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg)}.trd>b{display:block;margin-bottom:8px;font-size:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 small{color:var(--mut);font-size:12px}.g3 div>div{font-weight:700;font-size:14px}
.tg{width:54px;height:30px;border-radius:30px;border:0;background:#94a3b8;position:relative;cursor:pointer;transition:background .25s;flex:none;padding:0}.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0004;transition:transform .25s}.tg.on{background:var(--blue)}.tg.on i{transform:translateX(24px)}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="v"></main></div><div id="m"></div><div id="t"></div><div id="lk"></div><div id="sp"></div>
<script>
const $=s=>document.querySelector(s);
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('sv');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nk=s=>(s||'').trim().toLowerCase();
const P={food:'M7 3v8a2 2 0 002 2v8M7 3v5M11 3v5a2 2 0 01-2 2M17 3c-2 1-3 4-3 7h3v11',car:'M5 17h14M6 17V10l2-4h8l2 4v7M8 13.5h.01M16 13.5h.01',bag:'M6 8h12l1 12H5L6 8zM9 8a3 3 0 016 0',bill:'M6 3h12v18l-3-2-3 2-3-2-3 2V3zM9 8h6M9 12h6',heart:'M12 21s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 10c0 6-8 11-8 11z',tv:'M3 5h18v12H3zM8 21h8',book:'M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5zM8 7h7',cash:'M12 3v18M16 7h-6a3 3 0 000 6h4a3 3 0 010 6H8',eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 9a3 3 0 100 6 3 3 0 000-6z',eyeoff:'M17.9 17.9A10.9 10.9 0 0112 20C5 20 1 12 1 12a18.5 18.5 0 015.1-5.9M9.9 4.2A9.1 9.1 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.2 3.2M1 1l22 22',home:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',target:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z',gear:'M12 15a3 3 0 100-6 3 3 0 000 6zM19 12a7 7 0 00-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 00-1.7-1L14.5 3h-4l-.4 3a7 7 0 00-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 000 2l-2 1.6 2 3.4 2.4-1a7 7 0 001.7 1l.4 3h4l.4-3a7 7 0 001.7-1l2.4 1 2-3.4-2-1.6c.1-.3.1-.7.1-1z',up:'M12 19V5M5 12l7-7 7 7',down:'M12 5v14M5 12l7 7 7-7'};
const ic=(k,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[k]}"/></svg>`;
let S,page='dash',MOK,PEND,T={},M=today().slice(0,7);
const seed=()=>({v:2,plans:[],ybudgets:[],theme:'auto',accounts:[{id:'a1',name:'Tunai',init:0},{id:'a2',name:'Saldo',init:0}],tx:[],budgets:[],goals:[]});
function migrate(d){const cm={};(d.cats||[]).forEach(c=>cm[c.id]=c.name);const old=d.accounts||[];
 const ini=id=>old.filter(a=>id=='a1'?a.id=='a1':a.id!='a1').reduce((s,a)=>s+(+a.init||0),0);
 return {v:2,pin:d.pin||null,hide:!!d.hide,plans:[],ybudgets:d.ybudgets||[],theme:d.theme||'auto',accounts:[{id:'a1',name:'Tunai',init:ini('a1')},{id:'a2',name:'Saldo',init:ini('a2')}],
 tx:(d.tx||[]).filter(t=>t.type=='income'||t.type=='expense').map(t=>({...t,cat:cm[t.cat]||t.cat||'Lainnya',acc:t.acc=='a1'?'a1':'a2'})),
 budgets:(()=>{const bs=(d.budgets||[]).map(b=>({cat:cm[b.cat]||b.cat,limit:b.limit,sgoal:b.sgoal||0,saves:b.saves||[]}));(d.plans||[]).forEach(p=>{const x=bs.find(b=>nk(b.cat)==nk(p.name));if(x){x.saves=x.saves.concat(p.items||[]);if(!x.sgoal)x.sgoal=p.monthly}else bs.push({cat:p.name,limit:p.monthly,sgoal:p.monthly,saves:p.items||[]})});return bs})(),goals:d.goals||[]}}
function idb(){return new Promise((r,j)=>{const q=indexedDB.open('myfinance',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
async function load(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){try{return JSON.parse(localStorage.getItem('mf'))}catch(e){}}}
async function save(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'s')}catch(e){try{localStorage.setItem('mf',JSON.stringify(S))}catch(e){}}}
function commit(){save();render()}
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2600)}
const acc=id=>S.accounts.find(a=>a.id==id)?.name||'?';
const bal=a=>S.tx.reduce((s,t)=>t.acc!=a.id?s:t.type=='income'?s+t.amount:s-t.amount,a.init);
const inM=(t,m)=>t.date.slice(0,7)==m;
const sum=(m,type)=>S.tx.filter(t=>t.type==type&&inM(t,m)).reduce((s,t)=>s+t.amount,0);
function byCat(m,type){const o={};S.tx.filter(t=>t.type==type&&inM(t,m)).forEach(t=>{const k=nk(t.cat);(o[k]=o[k]||{n:t.cat.trim(),v:0}).v+=t.amount});return Object.values(o).sort((a,b)=>b.v-a.v)}
const catNames=type=>[...new Set(sorted(S.tx.filter(t=>t.type==type)).map(t=>t.cat.trim()))];
const bars=(rows,tot,c='var(--blue)')=>rows.map(r=>`<div class="br"><div class="row sp"><span>${esc(r.n)}</span><b>${rp(r.v)}</b></div><div class="bar"><i style="width:${tot?r.v/tot*100:0}%;background:${c}"></i></div></div>`).join('')||'<p class="mut">Belum ada data.</p>';
const mLabel=m=>new Date(m+'-15').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const shift=(m,d)=>{const x=new Date(m+'-15');x.setMonth(x.getMonth()+d);return x.toLocaleDateString('sv').slice(0,7)};
const sorted=l=>[...l].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
const mn=()=>`<div class="mn"><button onclick="M=shift(M,-1);render()">‹</button><span>${mLabel(M)}</span><button onclick="M=shift(M,1);render()">›</button></div>`;
const hdr=(title,x='')=>`<div class="top"><div class="bar2"><div><small>FINORA</small><h1>${title}</h1></div><button class="gear" onclick="page='set';render()">${ic('gear',20)}</button></div>${x}</div>`;
const txRow=t=>`<div class="sw" data-id="${t.id}"><div class="act"><span>Edit</span><span>Hapus</span></div><div class="li" onclick="if(!SWP)txForm('${t.id}')">${av(t)}<div class="m"><b>${esc(t.cat)}</b><div class="mut">${esc(acc(t.acc))}${t.note?' · '+esc(t.note):''}</div></div><b class="${t.type=='income'?'ok':'bad'}">${t.type=='income'?'+':'-'}${mk(t.amount)}</b></div></div>`;
function txRows(){let l=S.tx.filter(t=>inM(t,M));if(FT.q)l=l.filter(t=>nk(t.note+' '+t.cat+' '+acc(t.acc)).includes(nk(FT.q)));if(FT.type)l=l.filter(t=>t.type==FT.type);if(FT.cat)l=l.filter(t=>nk(t.cat)==nk(FT.cat));if(FT.acc)l=l.filter(t=>t.acc==FT.acc);return l}
function txList(rows){let d='',h='';sorted(rows).forEach(t=>{if(t.date!=d){d=t.date;h+=`<div class="dh">${new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</div>`}h+=txRow(t)});return h||'<p class="mut">Tidak ada transaksi.</p>'}
function srtRows(l){const k=SORT.k,d=SORT.d;const v=t=>k=='date'?t.date+t.id:k=='cat'?nk(t.cat):k=='acc'?acc(t.acc):k=='note'?nk(t.note):t.amount;return [...l].sort((a,b)=>{const x=v(a),y=v(b);return(x>y?1:x<y?-1:0)*d})}
function txTable(rows){const th=(k,l,c='')=>`<th class="${c}" onclick="srt('${k}')">${l}${SORT.k==k?(SORT.d>0?' ▲':' ▼'):''}</th>`;
 return `<table class="tb"><thead><tr>${th('date','Tanggal')}${th('cat','Kategori')}${th('acc','Sumber')}${th('note','Catatan')}${th('amount','Nominal','r')}</tr></thead><tbody>${srtRows(rows).map(t=>`<tr onclick="txForm('${t.id}')"><td>${t.date}</td><td><div class="row" style="flex-wrap:nowrap">${av(t,15,'sm')}<span>${esc(t.cat)}</span></div></td><td>${esc(acc(t.acc))}</td><td class="mut">${esc(t.note)}</td><td class="r ${t.type=='income'?'ok':'bad'}">${t.type=='income'?'+':'-'}${mk(t.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Tidak ada transaksi.</td></tr>'}</tbody></table>`}
function txBody(rows){const i=rows.filter(t=>t.type=='income').reduce((s,t)=>s+t.amount,0),e=rows.filter(t=>t.type=='expense').reduce((s,t)=>s+t.amount,0);return `<div class="sumb">Pemasukan <b class="ok">${mk(i)}</b> · Pengeluaran <b class="bad">${mk(e)}</b> · ${rows.length} transaksi</div><div class="lst">${txList(rows)}</div><div class="tbw">${txTable(rows)}</div>`}
function txUpd(){$('#tl').innerHTML=txBody(txRows())}
function srt(k){SORT.d=SORT.k==k?-SORT.d:(k=='date'||k=='amount'?-1:1);SORT.k=k;txUpd()}
const views={
dash(){const total=S.accounts.reduce((s,a)=>s+bal(a),0),i=sum(M,'income'),e=sum(M,'expense');const ms=[0,1,2,3,4,5].map(n=>shift(M,n-5));
 return hdr('Beranda',mn()+`<div class="bcard"><div class="row sp"><small>Total saldo</small><button class="eye" onclick="S.hide=!S.hide;commit()">${ic(S.hide?'eyeoff':'eye',18)}</button></div><div class="big">${mk(total)}</div><div class="src">${S.accounts.map(a=>`<div><small>${a.name}</small><b>${mk(bal(a))}</b></div>`).join('')}</div></div>`)+
 `<div class="body"><div class="dgrid">
 <div class="card stat s2"><div class="ic bgok">${ic('down',18)}</div><div class="mut">Pemasukan</div><div class="v ok">${mk(i)}</div></div>
 <div class="card stat s2"><div class="ic bgbad">${ic('up',18)}</div><div class="mut">Pengeluaran</div><div class="v bad">${mk(e)}</div></div>
 <div class="card stat s2 w"><div class="ic" style="background:#2563eb22;color:#2563eb">${ic('chart',18)}</div><div class="mut">Selisih bulan ini</div><div class="v ${i-e<0?'bad':'ok'}">${mk(i-e)}</div></div>
 <div class="card w s3"><h3>Wawasan</h3>${insights().map(x=>`<div class="ins"><div class="ic" style="background:${x.c}22;color:${x.c}">${ic(x.k,16)}</div><span>${x.t}</span></div>`).join('')}</div>
 <div class="card w s3"><h3>Pengeluaran per kategori</h3>${donut(byCat(M,'expense'),e)}</div>
 <div class="card w s3 dk" id="trc">${trendInner()}</div>
 <div class="card w s3"><div class="row sp"><h3>Transaksi terakhir</h3><a class="mut" onclick="page='tx';render()">Lihat semua</a></div>${sorted(S.tx).slice(0,6).map(txRow).join('')||'<p class="mut">Tekan tombol + untuk mencatat transaksi pertama.</p>'}</div></div></div>`},
tx(){const cs=[...new Set(S.tx.map(t=>t.cat.trim()))];return hdr('Transaksi',mn())+`<div class="body"><div class="card"><div class="flt"><input placeholder="Cari kategori atau catatan…" value="${esc(FT.q)}" oninput="FT.q=this.value;txUpd()"><select onchange="FT.type=this.value;txUpd()">${[['','Semua jenis'],['income','Pemasukan'],['expense','Pengeluaran']].map(o=>`<option value="${o[0]}" ${FT.type==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><select onchange="FT.cat=this.value;txUpd()"><option value="">Semua kategori</option>${cs.map(c=>`<option value="${esc(c)}" ${FT.cat&&nk(FT.cat)==nk(c)?'selected':''}>${esc(c)}</option>`).join('')}</select><select onchange="FT.acc=this.value;txUpd()"><option value="">Semua sumber</option>${S.accounts.map(a=>`<option value="${a.id}" ${FT.acc==a.id?'selected':''}>${a.name}</option>`).join('')}</select></div><div id="tl">${txBody(txRows())}</div></div></div>`},
rep(){const e=sum(M,'expense'),i=sum(M,'income');const ms=[0,1,2,3,4,5].map(n=>shift(M,n-5));
 return hdr('Laporan',mn())+`<div class="body"><div class="g2"><div class="card stat"><div class="mut">Pemasukan</div><div class="v ok">${mk(i)}</div></div><div class="card stat"><div class="mut">Pengeluaran</div><div class="v bad">${mk(e)}</div></div></div>
 <div class="card row sp"><span class="mut">Saldo bersih</span><b>${mk(i-e)}</b></div>
 <div class="card" id="trc">${trendInner()}</div>
 <div class="cols2"><div class="card"><h3>Pengeluaran per kategori</h3>${donut(byCat(M,'expense'),e)}</div><div class="card"><h3>Pemasukan per kategori</h3>${bars(byCat(M,'income'),i,'var(--ok)')}</div></div>
 <button class="bt" onclick="exportCSV()">Ekspor CSV bulan ini</button></div>`},
bud(){return hdr('Anggaran',mn())+`<div class="body"><div class="card"><div class="row sp"><h3>Anggaran bulanan</h3><button class="bt p" onclick="budForm()">+ Tambah</button></div>${S.budgets.map(budCard).join('')||'<p class="mut">Belum ada anggaran.</p>'}</div>
 <div class="card"><div class="row sp"><h3>Anggaran tahunan</h3><button class="bt p" onclick="yForm()">+ Tambah</button></div><div class="row sp" style="margin:6px 0 2px"><button class="bt" onclick="M=shift(M,-12);render()">‹</button><b>Tahun ${YR()}</b><button class="bt" onclick="M=shift(M,12);render()">›</button></div>${(S.ybudgets||[]).map(ycard).join('')||'<p class="mut">Belum ada anggaran tahunan, misalnya Liburan, Dana pendidikan, atau Servis kendaraan.</p>'}</div><div class="card"><div class="row sp"><h3>Target tabungan</h3><button class="bt p" onclick="goalForm()">+ Target</button></div>${S.goals.map(g=>{const p=g.saved/g.target*100;return `<div class="br"><div class="row sp"><b>${esc(g.name)}</b><span>${rp(g.saved)} / ${rp(g.target)}</span></div><div class="bar"><i style="width:${Math.min(p,100)}%;background:var(--ok)"></i></div><div class="row sp" style="margin-top:6px"><span class="mut"><b class="cnt" data-v="${Math.round(p)}">${Math.round(p)}%</b>${g.date?' · target '+g.date:''}</span><span><button class="bt" onclick="addSave('${g.id}')">+ Tabung</button> <button class="bt" onclick="goalForm('${g.id}')">Edit</button></span></div></div>`}).join('')||'<p class="mut">Belum ada target.</p>'}</div></div>`},
set(){return hdr('Pengaturan')+`<div class="body"><div class="card"><div class="row sp" style="margin-bottom:14px"><div><b>Mode gelap</b><div class="mut" id="tgt">${isDark()?'Aktif (tema gelap)':'Nonaktif (tema terang)'}</div></div><button type="button" class="tg ${isDark()?'on':''}" role="switch" aria-checked="${isDark()}" aria-label="Mode gelap" onclick="setDark(!isDark())"><i></i></button></div>
 <button class="bt" onclick="initForm()">Atur saldo awal Tunai &amp; Saldo</button></div>
 ${STANDALONE?'<div class="card"><h3>Aplikasi terpasang</h3><p class="mut">FINORA sudah berjalan sebagai aplikasi di perangkat ini.</p></div>':`<div class="card"><h3>Install aplikasi</h3><p class="mut">Pasang FINORA di layar utama Android agar terbuka seperti aplikasi dan bisa dipakai tanpa internet.</p><button class="bt p" onclick="installApp()">Install di Android</button></div>`}<div class="card"><h3>Keamanan</h3><p class="mut">${S.pin?'Kunci PIN aktif. Aplikasi terkunci saat dibuka kembali.':'Lindungi data keuangan Anda dengan PIN 4 angka.'}</p><div class="row">${S.pin?`<button class="bt" onclick="showLock('chg')">Ganti PIN</button><button class="bt d" onclick="showLock('off')">Matikan PIN</button>`:`<button class="bt p" onclick="showLock('set1')">Aktifkan kunci PIN</button>`}</div></div><div class="card"><h3>Unduh data</h3><p class="mut">Simpan salinan transaksi ke perangkat Anda (format CSV, bisa dibuka di Excel).</p><div class="row"><button class="bt p" onclick="exportCSV(true)">Semua transaksi</button><button class="bt" onclick="exportCSV()">Bulan ini</button></div></div><div class="card"><h3>Backup &amp; Restore</h3><p class="mut">Data hanya tersimpan di perangkat ini. Unduh backup secara rutin agar aman.</p><div class="row"><button class="bt p" onclick="backup()">Unduh backup</button><label class="bt" style="margin:0;color:var(--tx)">Restore<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div></div></div>`}
};

function saveTx(){const d=Object.fromEntries(new FormData($('#m form')));const a=+d.amount;
 if(!(a>0))return toast('Isi nominal terlebih dahulu');if(!d.cat.trim())return toast('Isi kategori terlebih dahulu');if(!d.date)return toast('Pilih tanggal');
 const o={id:T.id||uid(),type:T.type,amount:a,acc:T.acc,cat:d.cat.trim(),date:d.date,note:d.note.trim()};
 T.id?S.tx[S.tx.findIndex(x=>x.id==T.id)]=o:S.tx.push(o);closeM();commit();toast('Tersimpan')}

function budForm(i){const b=i!=null?S.budgets[i]:{};openForm('Anggaran bulanan',[{k:'cat',l:'Kategori pengeluaran',t:'text',v:b.cat||'',dl:catNames('expense')},{k:'limit',l:'Batas per bulan (Rp)',t:'number',v:b.limit||''},{k:'sgoal',l:'Target tabung per bulan (Rp, kosongkan = pakai batas anggaran)',t:'number',v:b.sgoal||''}],d=>{if(!d.cat.trim()||!(+d.limit>0))return toast('Lengkapi data'),false;const o={cat:d.cat.trim(),limit:+d.limit,sgoal:+d.sgoal||0,saves:b.saves||[]};i!=null?S.budgets[i]=o:S.budgets.push(o);commit()},i!=null?delBtn(`S.budgets.splice(${i},1)`):'')}
function goalForm(id){const g=id?S.goals.find(x=>x.id==id):{};openForm('Target tabungan',[{k:'name',l:'Nama target',t:'text',v:g.name||''},{k:'target',l:'Nominal target (Rp)',t:'number',v:g.target||''},{k:'date',l:'Target tanggal',t:'date',v:g.date||''}],d=>{if(!d.name.trim()||!(+d.target>0))return toast('Lengkapi data'),false;if(id)Object.assign(g,{name:d.name,target:+d.target,date:d.date});else S.goals.push({id:uid(),name:d.name.trim(),target:+d.target,date:d.date,saved:0});commit()},id?delBtn(`S.goals=S.goals.filter(x=>x.id!='${id}')`):'')}
function addSave(id){const g=S.goals.find(x=>x.id==id);openForm('Tabung: '+esc(g.name),[{k:'n',l:'Nominal (Rp)',t:'number',v:''}],d=>{if(!(+d.n>0))return false;g.saved+=+d.n;commit()})}

const PAL=['#2563eb','#16a34a','#f59e0b','#dc2626','#7c3aed','#0891b2','#db2777'];
function donut(rows,tot){if(!rows.length||!tot)return '<p class="mut">Belum ada data.</p>';
 const L=rows.slice(0,6);const ex=rows.slice(6).reduce((s,r)=>s+r.v,0);if(ex>0)L.push({n:'Lainnya',v:ex});let off=25;
 const arcs=L.map((r,i)=>{const p=r.v/tot*100,d=Math.max(p-.8,.1);const c=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="5.5" stroke-dasharray="${d} ${100-d}" stroke-dashoffset="${off}" class="dn"/>`;off-=p;return c}).join('');
 return `<div class="dwrap"><svg viewBox="0 0 42 42" class="dsv"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--bd)" stroke-width="5.5"/>${arcs}<text x="21" y="20" text-anchor="middle" font-size="3" fill="currentColor" opacity=".6">Total</text><text x="21" y="25" text-anchor="middle" font-size="3.6" font-weight="700" fill="currentColor">${S.hide?'••••':short(tot)}</text></svg><div class="lg">${L.map((r,i)=>`<div class="row sp"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><i class="dot" style="background:${PAL[i%PAL.length]}"></i>${esc(r.n)}</span><b>${Math.round(r.v/tot*100)}%</b></div>`).join('')}</div></div>`}
function lineChart(ms){const W=300,H=120,pd=14;const iv=ms.map(m=>sum(m,'income')),ev=ms.map(m=>sum(m,'expense'));const mx=Math.max(1,...iv,...ev);
 const x=i=>pd+i*(W-2*pd)/(ms.length-1),y=v=>H-pd-(v/mx)*(H-2*pd-6);
 const path=a=>a.map((v,i)=>i?`C${(x(i-1)+x(i))/2},${y(a[i-1])} ${(x(i-1)+x(i))/2},${y(v)} ${x(i)},${y(v)}`:`M${x(0)},${y(v)}`).join('');
 const ln=(a,c)=>`<path d="${path(a)}" pathLength="1" class="ln" stroke="${c}"/>`+a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${c}"/>`).join('');
 return `<svg viewBox="0 0 ${W} ${H+16}" width="100%" style="color:var(--mut);margin-top:6px">${[0,.5,1].map(g=>`<line x1="${pd}" x2="${W-pd}" y1="${H-pd-g*(H-2*pd-6)}" y2="${H-pd-g*(H-2*pd-6)}" stroke="var(--bd)"/>`).join('')}${ln(iv,'#16a34a')}${ln(ev,'#dc2626')}${ms.map((m,i)=>`<text x="${x(i)}" y="${H+8}" text-anchor="middle" font-size="10" fill="currentColor">${new Date(m+'-15').toLocaleDateString('id-ID',{month:'short'})}</text>`).join('')}</svg>`}

let LK={};
async function hp(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('finora:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa('finora:'+p)}}
const LKT={unlock:'Masukkan PIN',off:'Masukkan PIN untuk mematikan',chg:'Masukkan PIN lama',set1:'Buat PIN baru',set2:'Ulangi PIN baru'};
function showLock(mode){LK={mode,buf:'',first:''};drawLock()}
function closeLock(){$('#lk').innerHTML='';LK={}}
function drawLock(msg){const m=LK.mode;$('#lk').innerHTML=`<div class="lkc"><div>${LOGO.replace('width="36" height="36"','width="76" height="76"')}</div><h2 style="margin:12px 0 2px;letter-spacing:3px">FINORA</h2><div style="opacity:.8">${msg||LKT[m]}</div><div class="dots" id="ds">${[0,1,2,3].map(i=>`<i class="${i<LK.buf.length?'on':''}"></i>`).join('')}</div><div class="lkp">${['1','2','3','4','5','6','7','8','9'].map(k=>`<button onclick="lk('${k}')">${k}</button>`).join('')}<button onclick="${m=='unlock'?'lkForgot()':'closeLock()'}" style="font-size:13px">${m=='unlock'?'Lupa PIN':'Batal'}</button><button onclick="lk('0')">0</button><button onclick="lk('b')">⌫</button></div></div>`}
function lkForgot(){$('#lk').innerHTML=`<div class="lkc"><h3>Lupa PIN?</h3><p style="opacity:.85">Satu-satunya cara adalah menghapus semua data dan PIN di perangkat ini, lalu memulihkan dari file backup.</p><div class="row" style="justify-content:center"><button class="bt" onclick="drawLock()">Batal</button><button class="bt p" style="background:var(--bad);border-color:var(--bad)" onclick="S=seed();save();theme();closeLock();render()">Hapus semua data</button></div></div>`}
async function lk(k){if(k=='b')LK.buf=LK.buf.slice(0,-1);else if(LK.buf.length<4)LK.buf+=k;drawLock();if(LK.buf.length<4)return;
 const h=await hp(LK.buf),m=LK.mode;
 if(m=='unlock'||m=='off'||m=='chg'){if(h==S.pin){if(m=='unlock')closeLock();else if(m=='off'){S.pin=null;closeLock();commit();toast('PIN dimatikan')}else{LK={mode:'set1',buf:'',first:''};drawLock()}}else{LK.buf='';drawLock('PIN salah');$('#ds').classList.add('shake');navigator.vibrate&&navigator.vibrate(80)}}
 else if(m=='set1'){LK={mode:'set2',buf:'',first:LK.buf};drawLock()}
 else if(m=='set2'){if(LK.buf==LK.first){S.pin=h;closeLock();commit();toast('PIN aktif')}else{LK={mode:'set1',buf:'',first:''};drawLock('PIN tidak sama, ulangi')}}}

function ci(name,type){const n=nk(name);const m=[[/makan|minum|kopi|resto|jajan|snack|bakso|nasi|cafe|kafe|kuliner|sarapan|lunch|dinner/,'food','#f59e0b'],[/bensin|bbm|ojek|grab|gojek|parkir|\btol\b|\bbus\b|kereta|motor|mobil|transport|angkot|servis|service/,'car','#2563eb'],[/belanja|market|toko|baju|pakaian|shop|sepatu|online/,'bag','#db2777'],[/listrik|\bair\b|pulsa|internet|tagihan|wifi|\bkos\b|sewa|cicil|pajak|asuransi|langganan/,'bill','#0891b2'],[/obat|dokter|kesehatan|\brs\b|klinik|apotek|vitamin/,'heart','#dc2626'],[/hiburan|nonton|game|film|wisata|liburan|musik|netflix|spotify/,'tv','#7c3aed'],[/sekolah|kuliah|buku|kursus|pendidikan|\bspp\b|\bles\b/,'book','#16a34a'],[/gaji|bonus|bisnis|hadiah|upah|dividen|honor|\bthr\b|usaha|jual/,'cash','#16a34a']];
 const f=m.find(x=>x[0].test(n));if(f)return{k:f[1],c:f[2]};if(type=='income')return{k:'cash',c:'#16a34a'};let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))|0;return{k:null,c:PAL[Math.abs(h)%PAL.length]}}
function av(t,s=20,cl=''){const c=ci(t.cat,t.type);return `<div class="av ${cl}" style="background:${c.c}22;color:${c.c}">${c.k?ic(c.k,s):esc((t.cat||'?').trim().charAt(0).toUpperCase())}</div>`}
function insights(){const out=[],i=sum(M,'income'),e=sum(M,'expense'),pe=sum(shift(M,-1),'expense');
 if(!S.tx.some(t=>inM(t,M)))return [{t:'Belum ada transaksi bulan ini. Mulai catat dengan tombol +.',k:'up',c:'#2563eb'}];
 if(pe>0&&e>0){const p=Math.round((e-pe)/pe*100);if(Math.abs(p)>=5)out.push(p>0?{t:`Pengeluaran naik ${p}% dibanding bulan lalu.`,c:'#dc2626',k:'up'}:{t:`Pengeluaran turun ${-p}% dibanding bulan lalu. Bagus!`,c:'#16a34a',k:'down'})}
 const bc=byCat(M,'expense');if(bc[0]&&e)out.push({t:`Terbesar: ${esc(bc[0].n)} (${Math.round(bc[0].v/e*100)}% dari pengeluaran).`,c:'#f59e0b',k:'chart'});
 S.budgets.forEach(b=>{const u=S.tx.filter(t=>t.type=='expense'&&nk(t.cat)==nk(b.cat)&&inM(t,M)).reduce((s,t)=>s+t.amount,0),p=u/b.limit*100;if(p>=100)out.push({t:`Anggaran ${esc(b.cat)} terlampaui.`,c:'#dc2626',k:'bill'});else if(p>=80)out.push({t:`Anggaran ${esc(b.cat)} sudah ${Math.round(p)}%.`,c:'#f59e0b',k:'bill'})});
 if(i>0){const r=Math.round((i-e)/i*100);out.push(r>=0?{t:`Anda menyisihkan ${r}% dari pemasukan bulan ini.`,c:'#16a34a',k:'cash'}:{t:'Pengeluaran melebihi pemasukan bulan ini.',c:'#dc2626',k:'down'})}
 S.budgets.forEach(b=>{if(b.sgoal>0&&bsv(b)>=b.sgoal)out.unshift({t:`Target menabung ${esc(b.cat)} bulan ini tercapai.`,c:'#16a34a',k:'cash'})});
 (S.ybudgets||[]).forEach(b=>{const ref=b.sgoal>0?b.sgoal:b.limit;if(ref>0&&ysv(b)>=ref)out.unshift({t:`Target menabung tahunan ${esc(b.cat)} tercapai.`,c:'#16a34a',k:'cash'})});

let TP='m',TS=null,TMk='';
function trData(p){const y=+M.slice(0,4),mo=+M.slice(5,7),L=[],I=[],E=[],T=[];
 const add=f=>{let i=0,e=0;S.tx.forEach(t=>{if(f(t.date)){t.type=='income'?i+=t.amount:e+=t.amount}});I.push(i);E.push(e)};
 const mname=new Date(y,mo-1,15).toLocaleDateString('id-ID',{month:'long'});
 if(p=='d'){const n=new Date(y,mo,0).getDate();for(let d=1;d<=n;d++){const ds=M+'-'+String(d).padStart(2,'0');L.push(String(d));T.push(new Date(ds+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));add(x=>x==ds)}}
 else if(p=='w'){const n=new Date(y,mo,0).getDate();for(let k=0;k<Math.ceil(n/7);k++){const a=k*7+1,b=Math.min(a+6,n);L.push('M'+(k+1));T.push(`Minggu ${k+1} (${a}–${b} ${mname} ${y})`);add(x=>x.slice(0,7)==M&&+x.slice(8)>=a&&+x.slice(8)<=b)}}
 else if(p=='m'){for(let k=1;k<=12;k++){const ym=y+'-'+String(k).padStart(2,'0'),dt=new Date(y,k-1,15);L.push(dt.toLocaleDateString('id-ID',{month:'short'}));T.push(dt.toLocaleDateString('id-ID',{month:'long',year:'numeric'}));add(x=>x.slice(0,7)==ym)}}
 else{for(let k=y-4;k<=y;k++){L.push(String(k));T.push('Tahun '+k);add(x=>x.slice(0,4)==String(k))}}
 return{L,I,E,T}}
function trDef(p,n){const now=today(),cur=M==now.slice(0,7);if(p=='d')return cur?+now.slice(8)-1:n-1;if(p=='w')return cur?Math.min(Math.floor((+now.slice(8)-1)/7),n-1):n-1;if(p=='m')return +M.slice(5,7)-1;return n-1}
function trendInner(){if(TMk!=M){TS=null;TMk=M}const D=trData(TP),n=D.L.length;const sel=TS==null||TS>=n?trDef(TP,n):TS;
 const sw={d:26,w:60,m:34,y:60}[TP],W=n*sw,H=150,ch=H-26,mx=Math.max(1,...D.I,...D.E);const bh=v=>v>0?Math.max(2,v/mx*(ch-8)):0;
 const bars=D.L.map((l,i)=>{const x=i*sw,bw=sw*.34,hi=bh(D.I[i]),he=bh(D.E[i]);return `${i==sel?`<rect x="${x+2}" y="0" width="${sw-4}" height="${ch+20}" rx="6" fill="currentColor" opacity=".1"/>`:''}<rect class="tb2" x="${x+sw*.14}" y="${ch-hi}" width="${bw}" height="${hi}" rx="3" fill="#16a34a"/><rect class="tb2" x="${x+sw*.52}" y="${ch-he}" width="${bw}" height="${he}" rx="3" fill="#dc2626"/><text x="${x+sw/2}" y="${H-6}" text-anchor="middle" font-size="${TP=='d'?9:11}" font-weight="${i==sel?700:400}" fill="currentColor" opacity="${i==sel?1:.65}">${l}</text><rect x="${x}" y="0" width="${sw}" height="${H}" fill="transparent" style="cursor:pointer" onclick="trSel(${i})"/>`}).join('');
 return `<h3>Grafik keuangan</h3><div class="seg trt">${[['d','Harian'],['w','Mingguan'],['m','Bulanan'],['y','Tahunan']].map(o=>`<button type="button" class="${TP==o[0]?'on sr':''}" onclick="trSet('${o[0]}')">${o[1]}</button>`).join('')}</div>
 <div class="trs" id="trs" data-i="${sel}" data-n="${n}"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${W}px;color:var(--mut);display:block"><line x1="0" x2="${W}" y1="${ch}" y2="${ch}" stroke="var(--bd)"/>${bars}</svg></div>
 <div class="mut" style="margin:4px 0 0"><span class="ok">■</span> Pemasukan &nbsp; <span class="bad">■</span> Pengeluaran · Ketuk grafik untuk melihat nominal</div>
 <div class="trd"><b>${D.T[sel]}</b><div class="g3"><div><small>Pemasukan</small><div class="ok">${mk(D.I[sel])}</div></div><div><small>Pengeluaran</small><div class="bad">${mk(D.E[sel])}</div></div><div><small>Selisih</small><div>${mk(D.I[sel]-D.E[sel])}</div></div></div></div>`}
